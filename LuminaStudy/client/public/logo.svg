<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hexagonal prism / light crystal -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7001A"/>
      <stop offset="50%" stop-color="#E60023"/>
      <stop offset="100%" stop-color="#7C6FCD"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60023" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6FCD"/>
      <stop offset="100%" stop-color="#C4B5E0" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#g1)"/>
  
  <!-- Main diamond/prism shape -->
  <polygon points="32,8 52,26 32,44 12,26" fill="white" fill-opacity="0.92" filter="url(#glow)"/>
  
  <!-- Inner facets -->
  <polygon points="32,8 52,26 32,26" fill="url(#g2)" fill-opacity="0.5"/>
  <polygon points="12,26 32,26 32,44" fill="url(#g3)" fill-opacity="0.5"/>
  <line x1="32" y1="8" x2="32" y2="44" stroke="white" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="12" y1="26" x2="52" y2="26" stroke="white" stroke-width="0.5" stroke-opacity="0.6"/>
  
  <!-- Light rays -->
  <line x1="32" y1="44" x2="20" y2="58" stroke="white" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="58" stroke="white" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="44" y2="58" stroke="white" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  
  <!-- Sparkle at top -->
  <circle cx="32" cy="8" r="2.5" fill="white" filter="url(#glow)"/>
  <circle cx="32" cy="26" r="3" fill="white" fill-opacity="0.9"/>
</svg>
